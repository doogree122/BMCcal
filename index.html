  .bmc-title {

  .bmc-subtitle { font-size: 14px; color: var(--bmc-ink-soft); margin-top: 6px; }

    inset: 0;
    background: rgba(20, 24, 35, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 1000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease;
  }
  .bmc-modal.open { opacity: 1; pointer-events: auto; }
  .bmc-modal-card {
    background: var(--bmc-card);
    border-radius: var(--bmc-radius);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.30);
    max-width: 560px; width: 100%;
    max-height: calc(100vh - 40px);
    overflow-y: auto;
    padding: 26px 28px 24px;
    position: relative;
  }
  .bmc-modal-close {
    position: absolute; top: 12px; right: 12px;

    color: var(--bmc-muted); cursor: pointer;
    padding: 6px 10px; border-radius: 6px;

  .bmc-modal-eyebrow {

  .bmc-modal-eyebrow.opportunity { color: var(--bmc-muted); }
  .bmc-modal-title {

    margin: 0 0 4px; font-weight: 600; line-height: 1.2;

  .bmc-modal-date { font-size: 13px; color: var(--bmc-ink-soft); margin: 0 0 14px; }
  .bmc-modal-meta {

    white-space: pre-wrap;

    border-right: 1px solid var(--bmc-rule); padding-right: 22px;

    display: inline-block; font-size: 10px; letter-spacing: 0.16em;

(function () {
  const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const MONTHS_FULL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  const WEEKDAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  const WEEKDAYS_FULL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];

  function parseDate(str) {
    const [y, m, d] = str.split("-").map(Number);
    return new Date(y, m - 1, d);
  }
  function todayLocal() {
    const t = new Date();
    return new Date(t.getFullYear(), t.getMonth(), t.getDate());
  }
  function escapeHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({
      "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
    }[c]));
  }
  function kindOf(e) {
    if (e.number != null && e.number !== "") return "main";
    if (/^mazel tov\b/i.test(e.title || "")) return "celebration";
    return "opportunity";
  }
  // Format a unit/description for display: HTML-escape, then wrap a literal
  // "1 PM" in the same time-style span used for start times, when it appears
  // immediately before "Kadima Event" (the five Kadima rows).
  function formatUnit(s) {
    const esc = escapeHtml(s);
    return esc.replace(/(1 PM)( Kadima Event)/g, '<span class="bmc-item-time">$1</span>$2');
  }
  // For list rows only: when an event is BOTH a numbered gathering AND a
  // Mazel Tov week, emit both classes so the row gets the split gradient
  // (purple on the left, gold on the right). The featured card keeps using
  // kindOf so its dominant color is the gold gathering treatment.
  function kindClassesOf(e) {
    const isMain = e.number != null && e.number !== "";
    const isCelebration = /^mazel tov\b/i.test(e.title || "");
    if (isMain && isCelebration) return "celebration main";
    return kindOf(e);
  }
  // Badge text is independent of row color: a numbered event always says
  // "Gathering #N" on its badge, regardless of color precedence.
  function badgeOf(e) {
    if (e.number != null && e.number !== "") return "Gathering #" + e.number;
    if (/^mazel tov\b/i.test(e.title || "")) return "Celebration";
    return "Opportunity";
  }

  // ----- Modal ------------------------------------------------------------
  const modal = document.getElementById("bmc-modal");
  const modalEls = {
    eyebrow: document.getElementById("bmc-modal-eyebrow"),
    title:   document.getElementById("bmc-modal-title"),
    date:    document.getElementById("bmc-modal-date"),
    meta:    document.getElementById("bmc-modal-meta"),
    notes:   document.getElementById("bmc-modal-notes"),
  };
  let lastFocused = null;

  function openModal(event) {
    lastFocused = document.activeElement;
    const kind = kindOf(event);
    const badgeText = badgeOf(event);
    modalEls.eyebrow.textContent = badgeText;
    modalEls.eyebrow.className = "bmc-modal-eyebrow " + kind;
    modalEls.title.textContent = event.title || "";
    // Long-form date + optional time
    const d = event._d || parseDate(event.date);
    const longDate = WEEKDAYS_FULL[d.getDay()] + ", " + MONTHS_FULL[d.getMonth()] +
                     " " + d.getDate() + ", " + d.getFullYear();
    modalEls.date.textContent = longDate + (event.time ? "  \u00b7  " + event.time : "");
    // Meta section: unit, plus lead when present
    const metaRows = [];
    if (event.unit) metaRows.push('<div><strong>Details:</strong> ' + escapeHtml(event.unit) + '</div>');
    if (event.lead) metaRows.push('<div><strong>Lead:</strong> ' + escapeHtml(event.lead) + '</div>');
    if (metaRows.length) {
      modalEls.meta.innerHTML = metaRows.join('');
      modalEls.meta.hidden = false;
    } else {
      modalEls.meta.innerHTML = '';
      modalEls.meta.hidden = true;
    }
    // Notes (may not exist yet on older event data)
    const notes = (event.notes || "").trim();
    if (notes) {
      modalEls.notes.textContent = notes;
      modalEls.notes.hidden = false;
    } else {
      modalEls.notes.textContent = "";
      modalEls.notes.hidden = true;
    }
    // Show
    modal.hidden = false;
    // Force reflow so the opacity transition triggers
    void modal.offsetWidth;
    modal.classList.add("open");
    document.body.style.overflow = "hidden";
    // Focus the close button so keyboard users can dismiss immediately
    setTimeout(function () {
      const btn = document.getElementById("bmc-modal-close");
      if (btn) btn.focus();
    }, 50);
  }

  function closeModal() {
    modal.classList.remove("open");
    document.body.style.overflow = "";
    setTimeout(function () { modal.hidden = true; }, 150);
    if (lastFocused && lastFocused.focus) lastFocused.focus();
  }

  document.getElementById("bmc-modal-close").addEventListener("click", closeModal);
  modal.addEventListener("click", function (ev) {
    // Close when clicking the backdrop, not the card itself.
    if (ev.target === modal) closeModal();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key === "Escape" && modal.classList.contains("open")) closeModal();
  });
  // ------------------------------------------------------------------------

  const today = todayLocal();
  const upcoming = EVENTS
    .filter(e => e && e.date)
    .map(e => ({ ...e, _d: parseDate(e.date) }))
    .filter(e => e._d >= today)
    .sort((a, b) => a._d - b._d);

  const featuredSlot = document.getElementById("bmc-featured-slot");
  if (upcoming.length === 0) {
    featuredSlot.innerHTML = '<div class="bmc-featured"><div class="bmc-featured-body"><div class="bmc-featured-tag">Season complete</div><h2 class="bmc-featured-name">No upcoming events on the calendar</h2><p class="bmc-featured-unit">Check back soon for the next cohort schedule.</p></div></div>';
  } else {
    const next = upcoming[0];
    const d = next._d;
    const kind = kindOf(next);
    const isMain = kind === "main";
    const badge = badgeOf(next);
    // Featured tag uses just the category word (no gathering number).
    const tagLabel = badge.replace(/\s*#\d+$/, "").toLowerCase();
    const meta = [];
    // Only show start time for numbered gatherings.
    if (next.time && next.number != null && next.number !== "") meta.push('<span><strong>' + escapeHtml(next.time) + '</strong></span>');

    featuredSlot.innerHTML =
      '<div class="bmc-featured ' + kind + '" role="button" tabindex="0" aria-haspopup="dialog">' +
        '<div class="bmc-featured-date">' +
          '<div class="bmc-featured-month">' + MONTHS[d.getMonth()] + '</div>' +
          '<div class="bmc-featured-day">' + d.getDate() + '</div>' +
          '<div class="bmc-featured-weekday">' + WEEKDAYS[d.getDay()] + ' · ' + d.getFullYear() + '</div>' +
        '</div>' +
        '<div class="bmc-featured-body">' +
          '<div class="bmc-featured-tag ' + (isMain ? "" : kind) + '">Next ' + tagLabel + '</div>' +
          '<h2 class="bmc-featured-name">' +
            escapeHtml(next.title) +
          '</h2>' +
          '<p class="bmc-featured-unit">' + escapeHtml(next.unit || "") + '</p>' +
          '<div class="bmc-featured-meta">' +
            '<span><strong>' + WEEKDAYS_FULL[d.getDay()] + ', ' + MONTHS_FULL[d.getMonth()] + ' ' + d.getDate() + ', ' + d.getFullYear() + '</strong></span>' +
            meta.join("") +
          '</div>' +
          '<div class="bmc-featured-hint">Click for details &rsaquo;</div>' +
        '</div>' +
      '</div>';

    // Wire up the click / keyboard handlers on the featured card.
    const card = featuredSlot.querySelector('.bmc-featured');
    if (card) {
      const openHandler = function () { openModal(next); };
      card.addEventListener('click', openHandler);
      card.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') {
          ev.preventDefault();
          openHandler();
        }
      });
    }
  }

  const list = document.getElementById("bmc-list");
  const rest = upcoming.slice(1);
  if (rest.length === 0) {
    list.innerHTML = '<li class="bmc-item opportunity"><div></div><div class="bmc-item-body"><p class="bmc-item-name">No additional events scheduled.</p></div><div></div></li>';
    return;
  }

  list.innerHTML = rest.map(function (e) {
    const d = e._d;
    const kind = kindClassesOf(e);
    const subtitleParts = [];
    // Only show start time for numbered gatherings.
    if (e.time && e.number != null && e.number !== "") subtitleParts.push('<span class="bmc-item-time">' + escapeHtml(e.time) + '</span>');
    if (e.unit) subtitleParts.push(formatUnit(e.unit));
    const subtitle = subtitleParts.join(' · ');
    return (
      '<li class="bmc-item ' + kind + '">' +
        '<div class="bmc-item-date">' +
          '<div class="bmc-item-month">' + MONTHS[d.getMonth()] + '</div>' +
          '<div class="bmc-item-day">' + d.getDate() + '</div>' +
          '<div class="bmc-item-weekday">' + WEEKDAYS[d.getDay()] + '</div>' +
        '</div>' +
        '<div class="bmc-item-body">' +
          '<p class="bmc-item-name">' +
            escapeHtml(e.title) +
          '</p>' +
          (subtitle ? '<p class="bmc-item-unit">' + subtitle + '</p>' : "") +
        '</div>' +
        '<div class="bmc-item-badge">' + badgeOf(e) + '</div>' +
      '</li>'
    );
  }).join("");
})();
</script>
